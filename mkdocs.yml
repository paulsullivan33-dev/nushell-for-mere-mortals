site_name: Nushell for Mere Mortals
site_description: A shell where pipelines carry tables instead of text. Opening CSV and JSON files as data you can filter and sort by column name, converting between formats, mixing in ordinary programs, and meeting the type system that refuses to add a string to a number, with the limits stated plainly.
